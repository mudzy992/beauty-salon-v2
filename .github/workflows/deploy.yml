name: Deploy beauty-salon-v2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed parts
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "First push on branch, assuming both backend and frontend changed."
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          BACKEND_CHANGED=false
          FRONTEND_CHANGED=false

          if echo "$CHANGED_FILES" | grep -q '^backend/'; then
            BACKEND_CHANGED=true
          fi
          if echo "$CHANGED_FILES" | grep -q '^frontend/'; then
            FRONTEND_CHANGED=true
          fi

          echo "backend_changed=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SERVER_SSH_PORT }}" "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          APP_PATH: ${{ secrets.APP_PATH }}
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend_changed }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend_changed }}
        run: |
          # Trim APP_PATH (secrets often have trailing newline when pasted)
          APP_PATH=$(printf '%s' "$APP_PATH" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$APP_PATH" ]; then
            echo "::error::APP_PATH secret is empty or invalid."
            exit 1
          fi

          echo "Backend changed: $BACKEND_CHANGED"
          echo "Frontend changed: $FRONTEND_CHANGED"

          ssh -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_IP" bash << EOF
          set -euo pipefail
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::APP_PATH does not exist on server (check repository secrets.APP_PATH)."
            exit 1
          fi
          cd "$APP_PATH"
          echo "Working directory: \$(pwd)"

          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Checking existing containers (including stopped)..."
          BACKEND_CONTAINER_ID=\$(docker compose ps -a -q backend || true)
          FRONTEND_CONTAINER_ID=\$(docker compose ps -a -q frontend || true)

          NEED_BACKEND_BOOTSTRAP=false
          NEED_FRONTEND_BOOTSTRAP=false

          if [ -z "\$BACKEND_CONTAINER_ID" ]; then
            echo "Backend container does not exist yet. Will bootstrap backend."
            NEED_BACKEND_BOOTSTRAP=true
          fi

          if [ -z "\$FRONTEND_CONTAINER_ID" ]; then
            echo "Frontend container does not exist yet. Will bootstrap frontend."
            NEED_FRONTEND_BOOTSTRAP=true
          fi

          echo "Deploying services based on changes and container state..."

          if [ "$BACKEND_CHANGED" = "true" ] || [ "\$NEED_BACKEND_BOOTSTRAP" = "true" ]; then
            echo "Recreating backend: stop, remove, clear cache, rebuild, start..."
            docker compose stop backend || true
            docker compose rm -f backend || true
            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "Pruning unused Docker build cache and images before backend rebuild..."
              docker builder prune -f || true
              docker image prune -f || true
            fi
            docker compose build --no-cache backend
            docker compose up -d backend
          fi

          if [ "$FRONTEND_CHANGED" = "true" ] || [ "\$NEED_FRONTEND_BOOTSTRAP" = "true" ]; then
            echo "Recreating frontend: stop, remove, clear cache, rebuild, start..."
            docker compose stop frontend || true
            docker compose rm -f frontend || true
            if [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "Pruning unused Docker build cache and images before frontend rebuild..."
              docker builder prune -f || true
              docker image prune -f || true
            fi
            docker compose build --no-cache frontend
            docker compose up -d frontend
          fi

          if [ "$BACKEND_CHANGED" != "true" ] && [ "$FRONTEND_CHANGED" != "true" ] && \
             [ "\$NEED_BACKEND_BOOTSTRAP" != "true" ] && [ "\$NEED_FRONTEND_BOOTSTRAP" != "true" ]; then
            echo "No changes in backend/ or frontend/ directories and both containers already built; nothing to redeploy."
          fi
          EOF
