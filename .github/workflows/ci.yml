  # Rendered a11y (axe) nad IZLOVANOM bazom. Postoji jer admin/stylist axe testovi
  # trebaju prijavljene naloge, a jedini stvarni nalozi su na produkciji - vidi
  # docs/audit/HANDOFF.md, "Zasto se ovo ne smije pokretati nad produkcijskom bazom".
  # Ovdje je baza jednokratni Postgres service kontejner, a naloge kreira
  # `npm run e2e:users` (backend/prisma/scripts/create-e2e-users.ts).
  #
  # Axe korak je BIO `continue-on-error` dok nikad nije bio izvrsen — tada bi bilo neposteno
  # tvrditi da prolazi (isti princip kao u frontend/playwright.config.ts). Skidanje je uvjetovano
  # potvrđenim zelenim runom, i taj dokaz sada postoji: run `42872969550` (commit `6a48167`)
  # daje **38 passed | 0 failed | 0 skipped** nad prijavljenim `/admin/**` i `/stylist/**`.
  # Zato `continue-on-error` i korak "Annotate" (koji je postojao samo da zaobiđe maskiranje
  # pada) više nisu tu — axe regresija sada STVARNO ruši CI.
  a11y-e2e:
    name: Rendered a11y (axe) nad izolovanom CI bazom
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: beauty_salon_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d beauty_salon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Auth rute (`login`, `register`, `verify-email`, `send-verification-email`) su po
      # odluci AUTH-01 **fail-closed**: bez Redis countera `HttpRateLimitInterceptor` vraca
      # genericki 503 + `Retry-After: 30` PRIJE provjere lozinke
      # (`common/rate-limiting/http-rate-limit.interceptor.ts:63`). Bez ovog servisa
      # `POST /auth/login` vraca 503, `auth.setup.ts` upise ok:false, a svih 25 admin/stylist
      # testova se tiho preskoci (izmjereno run 42854014729: 13 passed | 25 skipped).
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_PROVIDER: postgres
      # Jednokratni Redis za HTTP rate limiter; auth rute bez njega fail-closed (503).
      HTTP_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379
      # Jednokratni CI servis; nikad produkcijski ili dijeljeni podaci.
      DATABASE_URL: postgresql://ci_user:ci_only_not_a_secret@127.0.0.1:5432/beauty_salon_ci?schema=public
      # `validateRuntimeSecrets` (backend/src/config/runtime-secrets.ts) pada na startupu
      # bez ova dva; vrijednosti su iste kao u `backend` poslu.
      JWT_SECRET: ci_only_not_a_secret_value_replace_in_real_environments
      APP_SETTINGS_ENCRYPTION_KEY: Y2ktb25seS10ZXN0LWVuY3J5cHRpb24ta2V5LTMyYnk=
      # NODE_ENV=test: CORS_ALLOWED_ORIGINS je obavezan tek izvan development/test.
      NODE_ENV: test
      # vite proxy (frontend/vite.config.ts) cilja http://localhost:10001.
      PORT: "10001"
      # CI-only nalozi; kreira ih `npm run e2e:users` u jednokratnu bazu.
      E2E_ADMIN_USER: ci_a11y_admin
      E2E_ADMIN_PASS: ci-only-admin-pass-not-a-real-secret
      E2E_STYLIST_USER: ci_a11y_stylist
      E2E_STYLIST_PASS: ci-only-stylist-pass-not-a-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate
      - name: Apply migrations to disposable CI PostgreSQL
        working-directory: backend
        run: npm run db:migrate:deploy
      # `e2e:users` sam upsertuje uloge, ali seed ih jeftino uskladi s aplikacijom.
      - name: Seed roles
        working-directory: backend
        run: npm run db:seed
      # Skripta odbija raditi ako DATABASE_URL nije localhost - ovdje je 127.0.0.1.
      - name: Create disposable a11y test accounts
        working-directory: backend
        run: npm run e2e:users
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Start backend on port 10001
        working-directory: backend
        run: |
          nohup node dist/src/main.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend.pid"
      - name: Wait for backend /health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:10001/health > /dev/null 2>&1; then
              echo "backend spreman nakon ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend se nije podigao u 90s; log:"
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # `run-a11y-routes.mjs` izlazi s 1 ako dist/ ne postoji (vite preview servira build).
      #
      # NODE_ENV MORA biti production, iako posao postavlja NODE_ENV=test (backend ga treba
      # zbog CORS_ALLOWED_ORIGINS). Vite ne pregazi vec postavljeni NODE_ENV, pa bi build s
      # NODE_ENV=test vezao React-ov RAZVOJNI build. Izmjereno: 276.2 KiB gzip (production)
      # naspram 341.9 KiB gzip (test) -> `check-bundle-budget.mjs` pada na budzetu od 300 KiB
      # i cijeli posao pukne prije nego sto axe suite uopce dobije priliku da se pokrene.
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_ENV: production
        run: npm run build
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run rendered a11y (axe) suite
        id: axe
        working-directory: frontend
        # Izlaz se MORA iznijeti u anotaciju: logovi i artefakti žive na blob storageu koji
        # nije svugdje dostižan, pa se bez ovoga zna samo DA je suite pao, ne i koji čvor.
        run: |
          set +e
          npm run test:a11y-routes 2>&1 | tee "$RUNNER_TEMP/axe.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '### Axe suite — izlaz pada'
              echo ''
              echo "Izlazni kod: **$code**"
              echo ''
              echo '```'
              tail -n 80 "$RUNNER_TEMP/axe.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # `(critical)`/`(serious)` su ID-ovi axe pravila iz asertacije u specovima —
            # bez njih znamo samo BROJ prekršaja, ne i koje pravilo, pa se ne daju popraviti.
            msg=$(grep -aE '✘|[0-9]+ (passed|failed)|Error|Timed out|violation|\((critical|serious)\)' "$RUNNER_TEMP/axe.log" | head -60 | tr '\n' ' ' | tr -d '\r')
            if [ -z "$msg" ]; then
              msg=$(tail -c 2000 "$RUNNER_TEMP/axe.log" | tr '\n' ' ' | tr -d '\r')
            fi
            echo "::error title=axe suite pao (exit $code)::$msg"
          else
            # Ispisati i PROLAZ: izlazni kod 0 ne dokazuje da se ijedan test izvršio
            # (skripta izlazi s 0 i kad Chromium nije instaliran), a log se ne da dohvatiti.
            passed=$(grep -aoE '[0-9]+ passed' "$RUNNER_TEMP/axe.log" | tail -1)
            failed=$(grep -aoE '[0-9]+ failed' "$RUNNER_TEMP/axe.log" | tail -1)
            skipped=$(grep -aoE '[0-9]+ skipped' "$RUNNER_TEMP/axe.log" | tail -1)
            echo "::notice title=axe suite prošao (exit 0)::${passed:-bez 'passed' u izlazu} | ${failed:-0 failed} | ${skipped:-0 skipped}"
          fi
          # `set +e` iznad znači da bi korak bez ovoga izišao s 0 i kad axe padne — anotacija
          # bi bila crvena, a CI zelen. Ovo je linija koja pad stvarno prosljeđuje poslu.
          exit "$code"
          # `auth.setup.ts` upiše razlog PRESKAKANJA u status fajl, a preskočeni admin/stylist
          # testovi su tihi u anotacijama. Bez ovoga "0 failed" izgleda kao uspjeh iako
          # /admin/** i /stylist/** (HANDOFF §4 stavka 3) nisu ni izvršeni.
          for f in e2e/.auth/admin-status.json e2e/.auth/stylist-status.json; do
            if [ -f "$f" ]; then
              echo "::notice title=axe auth status $(basename "$f")::$(tr -d '\r\n' < "$f" | tr -s ' ')"
            else
              echo "::warning title=axe auth status::$(basename "$f") ne postoji — setup se nije izvršio"
            fi
          done
          exit "$code"
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
