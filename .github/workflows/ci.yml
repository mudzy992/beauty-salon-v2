name: CI

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository hygiene and static reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository hygiene
        run: python scripts/check_repo_hygiene.py
      - name: Check local Markdown links
        run: python scripts/check_doc_links.py
      - name: Enforce web BS/EN locale key parity
        run: python scripts/check_i18n.py --strict
      - name: Enforce selected theme contrast token pairs
        run: python scripts/check_ui_contrast.py --strict

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: beauty_salon_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d beauty_salon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_PROVIDER: postgres
      # Disposable CI-only service; never use production or shared application data here.
      DATABASE_URL: postgresql://ci_user:ci_only_not_a_secret@127.0.0.1:5432/beauty_salon_ci?schema=public
      E2E_DATABASE_URL: postgresql://ci_user:ci_only_not_a_secret@127.0.0.1:5432/beauty_salon_ci?schema=public
      JWT_SECRET: ci_only_not_a_secret_value_replace_in_real_environments
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate
      - name: Validate Prisma schema
        working-directory: backend
        run: npm run db:validate
      - name: Apply migrations to disposable CI PostgreSQL
        working-directory: backend
        run: npm run db:migrate:deploy
      - name: Build backend
        working-directory: backend
        run: |
          if npm run build > "$RUNNER_TEMP/backend-build.log" 2>&1; then
            cat "$RUNNER_TEMP/backend-build.log"
          else
            build_status=$?
            cat "$RUNNER_TEMP/backend-build.log"
            {
              echo '### Backend build failure (last 120 lines)'
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/backend-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            build_tail=$(tail -n 40 "$RUNNER_TEMP/backend-build.log" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Backend build diagnostic::$build_tail"
            exit "$build_status"
          fi
      - name: Build and inspect backend runtime and migration images
        working-directory: .
        run: bash scripts/check_backend_container.sh
      - name: Run blog sanitizer regression tests
        working-directory: backend
        run: npm run test:blog-sanitizer
      - name: Run DB-backed security HTTP tests
        id: backend-e2e
        continue-on-error: true
        working-directory: backend
        run: npm run test:e2e -- --runInBand --json --outputFile="$RUNNER_TEMP/e2e-jest-results.json"
      - name: Annotate failing E2E Jest names and redacted errors
        if: steps.backend-e2e.outcome == 'failure'
        run: node scripts/report_jest_failures.cjs "$RUNNER_TEMP/e2e-jest-results.json" --details
      - name: Run backend unit tests
        id: backend-jest
        working-directory: backend
        run: npm test -- --runInBand --json --outputFile="$RUNNER_TEMP/backend-jest-results.json"
      - name: Annotate failing Jest test names
        if: failure() && steps.backend-jest.outcome == 'failure'
        run: node scripts/report_jest_failures.cjs "$RUNNER_TEMP/backend-jest-results.json"
      - name: Fail backend job if DB-backed HTTP tests failed
        if: always() && steps.backend-e2e.outcome == 'failure'
        run: exit 1

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Test socket recovery policy
        working-directory: frontend
        run: npm run test:socket-recovery
      - name: Test dynamic brand contrast colors
        working-directory: frontend
        run: npm run test:brand-colors
      - name: Test localized registration errors
        working-directory: frontend
        run: npm run test:registration-errors
      - name: Test locale-aware date and amount formatting
        working-directory: frontend
        run: npm run test:locale-formatting
      - name: Test localized public reservation errors
        working-directory: frontend
        run: npm run test:reservation-errors
      - name: Test localized client reservation action errors
        working-directory: frontend
        run: npm run test:client-reservation-errors
      - name: Test localized admin API errors
        working-directory: frontend
        run: npm run test:admin-api-errors
      - name: Test localized profile API errors
        working-directory: frontend
        run: npm run test:profile-api-errors
      - name: Test localized public catalog UI
        working-directory: frontend
        run: npm run test:public-catalog-i18n
      - name: Test localized public home and before-and-after UI
        working-directory: frontend
        run: npm run test:before-after-i18n
      - name: Test localized public contact UI
        working-directory: frontend
        run: npm run test:public-contact-i18n
      - name: Test localized public blog list UI
        working-directory: frontend
        run: npm run test:public-blog-list-i18n
      - name: Test localized public blog post UI
        working-directory: frontend
        run: npm run test:public-blog-post-i18n
      - name: Test localized admin blog UI
        working-directory: frontend
        run: npm run test:admin-blog-i18n
      - name: Test localized stylist workbook list UI
        working-directory: frontend
        run: npm run test:stylist-workbook-list-i18n
      - name: Test localized stylist workbook detail UI
        working-directory: frontend
        run: npm run test:stylist-workbook-detail-i18n
      - name: Test localized stylist workbook reschedule UI
        working-directory: frontend
        run: npm run test:stylist-workbook-reschedule-i18n
      - name: Test localized stylist workbook new-entry UI
        working-directory: frontend
        run: npm run test:stylist-workbook-new-entry-i18n
      - name: Test localized stylist debt UI
        working-directory: frontend
        run: npm run test:stylist-debts-i18n
      - name: Test localized stylist statistics UI
        working-directory: frontend
        run: npm run test:stylist-stats-i18n
      - name: Test localized stylist reservation inbox UI
        working-directory: frontend
        run: npm run test:stylist-inbox-i18n
      - name: Test localized stylist schedule UI
        working-directory: frontend
        run: npm run test:stylist-schedule-i18n
      - name: Test localized stylist direct-booking UI
        working-directory: frontend
        run: npm run test:stylist-direct-booking-i18n
      - name: Test localized stylist reservation detail UI
        working-directory: frontend
        run: npm run test:stylist-reservation-detail-i18n
      - name: Test localized stylist reservation reason dialogs
        working-directory: frontend
        run: npm run test:stylist-reservation-reason-dialogs-i18n
      - name: Test runtime web language selection and fallback
        working-directory: frontend
        run: npm run test:i18n-language
      - name: Build (includes TypeScript project check)
        working-directory: frontend
        run: npm run build
      - name: Build frontend image with repository-root context
        run: >-
          docker build
          --file frontend/Dockerfile
          --build-arg VITE_API_URL=https://api.example.invalid
          --build-arg VITE_API_FILES_URL=https://files.example.invalid
          --tag beauty-salon-frontend:ci
          .

  mobile:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Test socket recovery policy
        working-directory: mobile
        run: npm run test:socket-recovery
      - name: Test multipart upload request handling
        working-directory: mobile
        run: npm run test:api-multipart
      - name: TypeScript check
        working-directory: mobile
        run: npm run typecheck
