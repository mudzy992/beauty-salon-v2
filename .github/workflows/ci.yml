        working-directory: frontend
        run: npm run test:public-a11y-axe-findings
      - name: Test admin gallery keyboard access
        working-directory: frontend
        run: npm run test:admin-gallery-keyboard
      # Guard: aria-label na <div>/<span>/<p> (role=generic) je zabranjen i AT ga
      # ignoriše (axe: aria-prohibited-attr), a klikabilan <tr>/<Card> bez pravog dugmeta
      # ostavlja miš kao jedini put (2.1.1). jsx-a11y NE vidi nijedno od toga.
      - name: Test generic aria-label and clickable row actions
        working-directory: frontend
        run: npm run test:generic-aria-and-row-actions
      # Guard: jsx-a11y/label-has-associated-control vidi samo labelu BEZ kontrole,
      # ne i kontrolu bez labele. Ovo pokriva obrnuti smjer, nad cijelim src/.
      - name: Test form controls have programmatic labels
        working-directory: frontend
        run: npm run test:form-control-labels
      # Guard: check_i18n.py --strict poredi samo BS <-> EN. Ovo pokriva smjer KOD ->
      # lokali: ključ koji ne postoji ILI je imenski prostor prikazuje se kao goli tekst,
      # a neprosljeđena interpolacija kao doslovno {{x}}.
      - name: Test i18n keys used in code actually resolve
        working-directory: frontend
        run: npm run test:i18n-key-resolution
      # Guard: 5 modula mapira TACNU bosansku poruku iz backenda na i18n ključ. Backend
      # nema i18n ni sloj kodova (425 hardkodiranih poruka), pa ugovor puca tiho: promjena
      # poruke u backendu -> Map.get() promaši -> generički fallback. Dva modula vracaju
      # kratke ključeve bez imenskog prostora, pa ih test:i18n-key-resolution NE vidi
      # (mutacija B3: obriši en ključ -> taj test prolazi, ovaj pada).
      - name: Test API-error translation keys resolve and match backend messages
        working-directory: frontend
        run: npm run test:api-error-keys-i18n
      # Guard: INVENTAR mjesta gdje sirova bosanska poruka iz backenda stize do UI-ja
      # (16 sirovih naslova + 37 toastApiError s previsenim naslovom a sirovim opisom).
      # Ne mijenja ponasanje i ne bira popravku — to je odluka vlasnika (I18N-01).
      # Pada ako se spisak promijeni, da se odluka donese svjesno, ne tiho.
      - name: Test raw API-error exposure inventory is unchanged
        working-directory: frontend
        run: npm run test:raw-api-error-exposure
      # Guard: opis u toastApiError se prevodi, a na engleskom se neprevedena bosanska
      # poruka izostavlja (WCAG 3.1.2). Bihevioralni test nad cistim modulom + ugovor
      # da useAppToast zaista prolazi kroz njega.
      - name: Test API-error toast description is localized
        working-directory: frontend
        run: npm run test:api-error-description
      # Guard (I18N-01 opcija c): frontend API_ERROR_CODE_TO_KEY mora imati IDENTICAN
      # skup kodova kao backend API_ERROR_CODES, a svaki ključ mora postojati u bs.json i
      # en.json. Pada i ako backend doda kod bez frontend prijevoda i obrnuto — prijevod
      # po kodu bi tada tiho pao na generički fallback.
      - name: Test API error codes match between backend registry and frontend map
        working-directory: frontend
        run: npm run test:api-error-code-parity
      # Guard (I18N-01 opcija c): svih 5 resolvera mora dati prednost kodu nad tekstom,
      # a client/public samo kodu svog imenskog prostora. Uhvatio je stvarnu rupu: omotač
      # resolveAdminApiErrorKey je odbacivao treci argument, pa 6 pozivnih mjesta nije
      # dobijalo prijevod po kodu iako je bio spojen.
      - name: Test API error codes take precedence in all five resolvers
        working-directory: frontend
        run: npm run test:api-error-code-resolution
      # Guard: jsx-a11y pravila moraju ostati na error (citaju se REZOLVANI nivoi preko
      # ESLint API-ja, pa pada i ako override tiho ponisti config).
      - name: Test ESLint jsx-a11y severity guard
        working-directory: frontend
        run: npm run test:eslint-a11y-severity
      # e2e/ NIJE u tsconfig.json (include:['src']), pa ga obican `tsc --noEmit` ne vidi.
      - name: Typecheck e2e (Playwright specovi)
        working-directory: frontend
        run: npm run typecheck:e2e
      # ESLint. `react-hooks/rules-of-hooks` = error (uvezeno poslije React #310 regresije:
      # hvata hookove pozvane nakon early return-a, sto ni tsc ni testovi nad izvorom ne vide).
      # Od 2026-11-09 i SAV `jsx-a11y` je na error (bilo 13 pravila na warn).
      # Preostalih 7 upozorenja su `react-hooks/exhaustive-deps` - namjerno warn.
      - name: Lint frontend (rules-of-hooks + jsx-a11y)
        working-directory: frontend
        run: npm run lint
      # Dug iz faze 3: skripta je postojala u package.json ali nikad nije dobila CI korak.
      - name: Test reservation list API contract
        working-directory: frontend
        run: npm run test:reservation-list-api-contract
      - name: Test localized stylist analytics page
        working-directory: frontend
        run: npm run test:stylist-analytics-i18n
      - name: Test localized SMTP email settings
        working-directory: frontend
        run: npm run test:email-settings-smtp-i18n
      - name: Test localized existing email templates
        working-directory: frontend
        run: npm run test:email-settings-templates-i18n
      - name: Test localized email campaigns
        working-directory: frontend
