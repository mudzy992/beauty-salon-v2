      - name: Test campaign unsubscribe read and mutation recovery
        working-directory: frontend
        run: npm run test:campaign-unsubscribe-recovery
      - name: Test runtime web language selection and fallback
        working-directory: frontend
        run: npm run test:i18n-language
      - name: Test localized route-guard loading states
        working-directory: frontend
        run: npm run test:route-guards-i18n
      - name: Test navigation drawer accessibility
        working-directory: frontend
        run: npm run test:navigation-drawer-accessibility
      - name: Test dashboard shell accessibility (skip link, landmarks, page titles)
        working-directory: frontend
        run: npm run test:shell-a11y
      - name: Test blog article language attribute (WCAG 3.1.2)
        working-directory: frontend
        run: npm run test:blog-language-a11y
      - name: Test localized amount formatting consistency (no toFixed + KM)
        working-directory: frontend
        run: npm run test:amount-format-consistency
      - name: Test data table consistency (shared classes, no per-consumer style overrides)
        working-directory: frontend
        run: npm run test:data-table-consistency
      - name: Test dashboard templates accessibility (data table, status, pagination, filters)
        working-directory: frontend
        run: npm run test:admin-templates-a11y
      - name: Test dashboard stat parity (finance and ops formulas unchanged)
        working-directory: frontend
        run: npm run test:dashboard-stat-parity
      - name: Test dashboard loading, empty and error states
        working-directory: frontend
        run: npm run test:dashboard-states
      - name: Test dashboard structural accessibility (headings, lists, tables, status)
        working-directory: frontend
        run: npm run test:dashboard-a11y
      - name: Render admin templates and dashboard (catches runtime crashes static tests miss)
        working-directory: frontend
        run: npm run test:admin-render-smoke
      - name: Run axe-core over rendered markup (no browser; jsdom DOM, structural rules only)
        working-directory: frontend
        run: npm run test:axe-render-a11y
      - name: Build (includes TypeScript project check)
        working-directory: frontend
        run: npm run build
      - name: Build frontend image with repository-root context
        run: >-
          docker build
          --file frontend/Dockerfile
