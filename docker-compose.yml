services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_API_FILES_URL: ${VITE_API_FILES_URL}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgres}
        DATABASE_URL: ${DATABASE_URL_BUILD}
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgres}
      PORT: ${PORT:-10001}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/usr/app/uploads}
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY}
      NODE_ENV: production
    volumes:
      - /mnt/shared-app-files/beauty-salon-v2:/usr/app/uploads
    restart: unless-stopped
